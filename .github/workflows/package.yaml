name: Test release package
on:
  pull_request:

permissions:
  contents: read

jobs:
  native-package:
    name: Native package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version: "25"
          check-latest: true
          cache: maven
      - name: Check native build tools
        shell: pwsh
        run: |-
          $platform = node -p 'process.platform + "-" + process.arch'
          if ($LASTEXITCODE -ne 0 -or $platform -ne $env:EXPECTED_PLATFORM) {
            throw "Runner platform does not match $env:EXPECTED_PLATFORM"
          }
          $nativeImage = if ($IsWindows) { 'bin/native-image.cmd' } else { 'bin/native-image' }
          & (Join-Path $env:JAVA_HOME $nativeImage) --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mvn --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      - name: Lint with Ultracite
        run: pnpm run check:ultracite
      - name: Build and pack the main package
        if: runner.os != 'Windows'
        run: npm pack
      - name: Build and pack the main package with Visual Studio x64 tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |-
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -version '[17.13.2,)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio x64 Build Tools 17.13.2 or later are required' }
          $script = Join-Path $env:RUNNER_TEMP 'pack-tlaplus.cmd'
          @"
          @echo off
          call "$install\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not defined WindowsSdkDir exit /b 1
          where cl.exe
          if errorlevel 1 exit /b 1
          call npm.cmd pack
          exit /b %errorlevel%
          "@ | Set-Content $script -Encoding ascii
          & $env:ComSpec /d /c $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack the platform package
        run: npm pack ./npm
      - name: Test the packed artifacts without Java on the consumer PATH
        shell: bash
        run: |-
          main=$(find . -maxdepth 1 -name 'ririnto-tlaplus-[0-9]*.tgz' -print -quit)
          platform=$(find . -maxdepth 1 -name "ririnto-tlaplus-${{ matrix.platform }}-*.tgz" -print -quit)
          npm test -- "$main" "$platform"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ matrix.platform }}
          path: "*.tgz"
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
