name: Test release package
on:
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  native-package:
    name: Native package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64-gnu
          - os: ubuntu-24.04-arm
            platform: linux-arm64-gnu
          - os: ubuntu-latest
            platform: linux-x64-musl
          - os: ubuntu-24.04-arm
            platform: linux-arm64-musl
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        if: ${{ !endsWith(matrix.platform, '-musl') }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ !endsWith(matrix.platform, '-musl') && 'pnpm' || '' }}
      - uses: graalvm/setup-graalvm@v1
        if: ${{ !endsWith(matrix.platform, '-musl') }}
        with:
          distribution: liberica
          java-version: "25"
          cache: maven
      - name: Check native build tools
        if: ${{ !endsWith(matrix.platform, '-musl') }}
        shell: pwsh
        run: |-
          $platform = node --input-type=module -e 'import { nativePlatform } from "./src/native-platform.mjs"; console.log(nativePlatform())'
          if ($LASTEXITCODE -ne 0 -or $platform -ne $env:EXPECTED_PLATFORM) {
            throw "Runner platform does not match $env:EXPECTED_PLATFORM"
          }
          $nativeImage = if ($IsWindows) { 'bin/native-image.cmd' } else { 'bin/native-image' }
          & (Join-Path $env:JAVA_HOME $nativeImage) --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mvn --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
        if: ${{ !endsWith(matrix.platform, '-musl') }}
      - name: Stamp the release version
        if: inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |-
          npm version "$(node scripts/release-version.mjs "$RELEASE_TAG")" --no-git-tag-version
          node scripts/sync-optional-deps.mjs
      - name: Build and pack the main package
        if: runner.os != 'Windows' && !endsWith(matrix.platform, '-musl')
        run: npm pack
      - name: Build and pack the main package with Visual Studio x64 tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |-
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -version '[17.13.2,)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio x64 Build Tools 17.13.2 or later are required' }
          $script = Join-Path $env:RUNNER_TEMP 'pack-tlaplus.cmd'
          @"
          @echo off
          call "$install\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not defined WindowsSdkDir exit /b 1
          where cl.exe
          if errorlevel 1 exit /b 1
          call npm.cmd pack
          exit /b %errorlevel%
          "@ | Set-Content $script -Encoding ascii
          & $env:ComSpec /d /c $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack the platform package
        if: ${{ !endsWith(matrix.platform, '-musl') }}
        run: npm pack ./npm
      - name: Lint with Ultracite
        if: ${{ !endsWith(matrix.platform, '-musl') }}
        run: pnpm run check:ultracite
      - name: Test the packed artifacts without Java on the consumer PATH
        if: ${{ !endsWith(matrix.platform, '-musl') }}
        shell: bash
        run: |-
          main=$(find . -maxdepth 1 -name 'tlaplus-mcp-tlaplus-mcp-[0-9]*.tgz' -print -quit)
          platform=$(find . -maxdepth 1 -name "tlaplus-mcp-tlaplus-mcp-${{ matrix.platform }}-[0-9]*.tgz" -print -quit)
          if [ -z "$main" ] || [ -z "$platform" ]; then
            echo "Expected the main and platform tarballs" >&2
            exit 1
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            elf=$(mktemp)
            trap 'rm -f "$elf"' EXIT
            tar -xOf "$platform" package/tlaplus-server > "$elf"
            echo "Runner libc: $(getconf GNU_LIBC_VERSION)"
            readelf -lW "$elf"
            readelf -dW "$elf"
            version_needs=$(LC_ALL=C readelf --version-info -W "$elf" | sed -n '/^Version needs section/,$p')
            printf '%s\n' "$version_needs"
            required_glibc=$(printf '%s\n' "$version_needs" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu | tail -n 1)
            echo "Highest required glibc version: $required_glibc"
          fi
          npm test -- "$main" "$platform"
      - name: Build, pack, and test in Alpine
        if: endsWith(matrix.platform, '-musl')
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/package-musl.sh "$EXPECTED_PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ matrix.platform }}
          path: "*.tgz"
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
