name: Test release package
on:
  pull_request:
  workflow_call:
    outputs:
      matrix:
        value: ${{ jobs.platforms.outputs.matrix }}
    inputs:
      release_tag:
        type: string

permissions:
  contents: read

jobs:
  platforms:
    name: Read the package matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test the release procedure without registry writes
        run: npm run check:test-release
      - id: matrix
        shell: bash
        run: |-
          matrix=$(jq -ce . .github/package-matrix.json)
          echo "value=$matrix" >> "$GITHUB_OUTPUT"
  behavior-viewer:
    name: TLC Behavior Viewer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run the Chromium regression
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: |-
          pnpm exec playwright install --with-deps chromium
          pnpm run test:viewer
  native-package:
    name: Native package (${{ matrix.platform }})
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        if: ${{ !matrix.alpine_container }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ !matrix.alpine_container && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - uses: graalvm/setup-graalvm@v1
        if: ${{ !matrix.alpine_container }}
        with:
          distribution: liberica
          java-version: "25"
          cache: maven
      - name: Check native build tools
        if: ${{ !matrix.alpine_container }}
        shell: pwsh
        run: |-
          $platform = node --input-type=module -e 'import { nativePlatform } from "./src/native-platform.mjs"; console.log(nativePlatform())'
          if ($LASTEXITCODE -ne 0 -or $platform -ne $env:EXPECTED_PLATFORM) {
            throw "Runner platform does not match $env:EXPECTED_PLATFORM"
          }
          & (Join-Path $env:JAVA_HOME $env:NATIVE_IMAGE) --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          mvn --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          NATIVE_IMAGE: ${{ matrix.native_image || 'bin/native-image' }}
      - run: pnpm install --frozen-lockfile
        if: ${{ !matrix.alpine_container }}
      - name: Stamp the release version
        if: inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |-
          npm version "$(node scripts/release-version.mjs "$RELEASE_TAG")" --no-git-tag-version
          node scripts/sync-optional-deps.mjs
      - name: Build, pack, and test native packages
        if: ${{ !matrix.alpine_container && !matrix.visual_studio }}
        env:
          TLAPLUS_PACKAGE_OUTPUT: .
        run: npm test
      - name: Build, pack, and test with Visual Studio x64 tools
        if: matrix.visual_studio
        shell: pwsh
        env:
          TLAPLUS_PACKAGE_OUTPUT: .
        run: |-
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -version '[17.13.2,)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) {
            throw 'Visual Studio x64 Build Tools 17.13.2 or later are required'
          }
          $script = Join-Path $env:RUNNER_TEMP 'pack-tlaplus.cmd'
          @"
          @echo off
          call "$install\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not defined WindowsSdkDir exit /b 1
          where cl.exe
          if errorlevel 1 exit /b 1
          call npm.cmd test
          exit /b %errorlevel%
          "@ | Set-Content $script -Encoding ascii
          & $env:ComSpec /d /c $script
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Lint with Ultracite
        if: ${{ !matrix.alpine_container }}
        run: pnpm run check:ultracite
      - name: Inspect the packaged GNU ELF
        if: matrix.inspect_gnu_elf
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |-
          platform=$(find . -maxdepth 1 -name "tlaplus-mcp-tlaplus-mcp-$PLATFORM-[0-9]*.tgz" -print -quit)
          elf=$(mktemp)
          trap 'rm -f "$elf"' EXIT
          tar -xOf "$platform" package/tlaplus-server > "$elf"
          echo "Runner libc: $(getconf GNU_LIBC_VERSION)"
          readelf -lW "$elf"
          readelf -dW "$elf"
          version_needs=$(LC_ALL=C readelf --version-info -W "$elf" | sed -n '/^Version needs section/,$p')
          printf '%s\n' "$version_needs"
          required_glibc=$(printf '%s\n' "$version_needs" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu | tail -n 1)
          echo "Highest required glibc version: $required_glibc"
      - name: Build, pack, and test in Alpine
        if: matrix.alpine_container
        shell: bash
        env:
          ALPINE_CONTAINER: ${{ matrix.alpine_container }}
          CONTAINER_ARCH: ${{ matrix.container_arch }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
          HOST_ARCH: ${{ matrix.host_arch }}
          JDK_ARCH: ${{ matrix.jdk_arch }}
        run: |-
          if [ "$(uname -m)" != "$HOST_ARCH" ]; then
            echo "Expected a native $HOST_ARCH runner for $EXPECTED_PLATFORM" >&2
            exit 1
          fi

          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          mkdir "$stage/output"
          git ls-files -z | tar -cf "$stage/source.tar" --null -T -

          release_asset=$(gh api 'repos/bell-sw/LibericaNIK/releases?per_page=30' |
            jq -cer --arg suffix "-linux-$JDK_ARCH-musl.tar.gz" '
              first(.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("25.")))
                | .assets[]
                | select((.name | startswith("bellsoft-liberica-vm-openjdk25")) and (.name | endswith($suffix)))
                | select(.digest | test("^sha256:[a-f0-9]{64}$"))
                | {url: .browser_download_url, checksum: (.digest | sub("^sha256:"; ""))})')
          curl --fail --silent --show-error --location --output "$stage/nik.tar.gz" \
            "$(jq -r '.url' <<< "$release_asset")"
          echo "$(jq -r '.checksum' <<< "$release_asset")  $stage/nik.tar.gz" | sha256sum --check

          docker run --rm --platform "linux/$CONTAINER_ARCH" \
            --mount "type=bind,source=$stage,target=/inputs,readonly" \
            --mount "type=bind,source=$stage/output,target=/packages" \
            --env EXPECTED_PLATFORM --env TLAPLUS_PACKAGE_OUTPUT=/packages "$ALPINE_CONTAINER" sh -ec '
              apk add --no-cache binutils build-base ca-certificates git linux-headers maven zlib-dev
              mkdir /build /opt/liberica
              tar -xf /inputs/source.tar -C /build
              tar -xf /inputs/nik.tar.gz -C /opt/liberica --strip-components=1
              cd /build
              git init --quiet
              export JAVA_HOME=/opt/liberica GRAALVM_HOME=/opt/liberica
              export PATH="/opt/liberica/bin:$PATH"
              test "$(node --input-type=module -e "import {nativePlatform} from \"./src/native-platform.mjs\"; console.log(nativePlatform())")" = "$EXPECTED_PLATFORM"
              echo "Alpine $(cat /etc/alpine-release)"
              native-image --version
              mvn --version
              manager=$(node -p "require(\"./package.json\").packageManager")
              npx --yes "$manager" install --frozen-lockfile
              npm test
              npx --yes "$manager" run check:ultracite
              readelf -lW npm/tlaplus-server | grep -F "Requesting program interpreter: /lib/ld-musl-"
              readelf -dW npm/tlaplus-server
              if readelf --version-info -W npm/tlaplus-server | grep -Fq "GLIBC_"; then
                echo "The musl executable unexpectedly requires glibc symbols" >&2
                exit 1
              fi
            '
          cp "$stage"/output/*.tgz .
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ matrix.platform }}
          path: "*.tgz"
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
