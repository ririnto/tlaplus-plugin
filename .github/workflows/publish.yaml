name: Publish package
on:
  push:
    tags:
      - "20*"

permissions:
  id-token: write
  contents: write

jobs:
  package:
    name: Build and check release packages
    permissions:
      contents: read
    uses: ./.github/workflows/package.yaml
    with:
      release_tag: ${{ github.ref_name }}
  preflight:
    name: Verify release tarballs
    needs: package
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      commit: ${{ steps.release.outputs.commit }}
      tarballs: ${{ steps.release.outputs.tarballs }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download every packed artifact
        uses: actions/download-artifact@v8
        with:
          pattern: npm-package-*
          path: packages
      - name: Verify one exact-version tarball per npm package
        id: release
        shell: bash
        env:
          PACKAGE_MATRIX: ${{ needs.package.outputs.matrix }}
        run: |-
          version=$(node scripts/release-version.mjs "$GITHUB_REF_NAME")
          dist_tag=$(node --input-type=module -e 'import { tlaDistTag } from "./scripts/tla-version.mjs"; console.log(tlaDistTag)')
          commit=$(git rev-parse HEAD)
          platforms=$(jq -r '.include | map(.platform) | sort[]' <<< "$PACKAGE_MATRIX")
          tarballs=()
          check_tarball() {
            local candidates=("$1"[0-9]*.tgz)
            local tarball="$1$version.tgz"
            if [ "${#candidates[@]}" -ne 1 ] || [ "${candidates[0]}" != "$tarball" ] || [ ! -f "$tarball" ]; then
              echo "Expected exactly one tarball at $tarball" >&2
              exit 1
            fi
            local packed_version
            packed_version=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
            if [ "$packed_version" != "$version" ]; then
              echo "Expected package version $version in $tarball, got $packed_version" >&2
              exit 1
            fi
            tarballs+=("$tarball")
          }
          check_tarball packages/npm-package-linux-x64-gnu/tlaplus-mcp-tlaplus-mcp-
          while IFS= read -r platform; do
            check_tarball "packages/npm-package-$platform/tlaplus-mcp-tlaplus-mcp-$platform-"
          done <<< "$platforms"
          {
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "commit=$commit"
            echo 'tarballs<<EOF'
            printf '%s\n' "${tarballs[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
  publish-platform:
    name: Publish platform package (${{ matrix.platform }})
    needs:
      - package
      - preflight
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.package.outputs.matrix) }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-package-${{ matrix.platform }}
          path: packages
      - name: Publish platform package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_DIST_TAG: ${{ needs.preflight.outputs.dist_tag }}
        run: |-
          npm publish "./packages/tlaplus-mcp-tlaplus-mcp-$PLATFORM-$RELEASE_VERSION.tgz" --access public --tag "$RELEASE_DIST_TAG"
  publish:
    name: Publish main package and create the GitHub release
    needs:
      - preflight
      - publish-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download every packed artifact
        uses: actions/download-artifact@v8
        with:
          pattern: npm-package-*
          path: packages
      - name: Publish main package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_DIST_TAG: ${{ needs.preflight.outputs.dist_tag }}
        run: |-
          npm publish "./packages/npm-package-linux-x64-gnu/tlaplus-mcp-tlaplus-mcp-$RELEASE_VERSION.tgz" --access public --tag "$RELEASE_DIST_TAG"
      - name: Create the GitHub release carrying the published npm tarballs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARBALLS: ${{ needs.preflight.outputs.tarballs }}
        run: |-
          mapfile -t tarballs <<< "$RELEASE_TARBALLS"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes "${tarballs[@]}"
  registry-smoke:
    name: Public registry smoke (${{ matrix.platform }})
    needs:
      - package
      - preflight
      - publish
    permissions: {}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.matrix) }}
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_DIST_TAG: ${{ needs.preflight.outputs.dist_tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      EXPECTED_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Fetch the smoke script at the release commit
        shell: bash
        run: |-
          curl --fail --silent --show-error --retry 3 --max-time 15 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_COMMIT/scripts/registry-smoke.mjs" \
            --output registry-smoke.mjs
      - uses: actions/setup-node@v7
        if: ${{ !matrix.alpine_container }}
        with:
          node-version: 24
          token: ""
          package-manager-cache: false
      - name: Install from public npm and exercise MCP
        if: ${{ !matrix.alpine_container }}
        shell: bash
        run: node registry-smoke.mjs "$RELEASE_VERSION" "$RELEASE_DIST_TAG" "$EXPECTED_PLATFORM"
      - name: Install from public npm and exercise MCP in Alpine
        if: matrix.alpine_container
        shell: bash
        env:
          ALPINE_CONTAINER: ${{ matrix.alpine_container }}
          CONTAINER_ARCH: ${{ matrix.container_arch }}
          HOST_ARCH: ${{ matrix.host_arch }}
        run: |-
          if [ "$(uname -m)" != "$HOST_ARCH" ]; then
            echo "Expected a native $HOST_ARCH runner for $EXPECTED_PLATFORM" >&2
            exit 1
          fi
          docker run --rm --platform "linux/$CONTAINER_ARCH" \
            --mount "type=bind,source=$PWD/registry-smoke.mjs,target=/registry-smoke.mjs,readonly" \
            "$ALPINE_CONTAINER" node /registry-smoke.mjs "$RELEASE_VERSION" "$RELEASE_DIST_TAG" "$EXPECTED_PLATFORM"
