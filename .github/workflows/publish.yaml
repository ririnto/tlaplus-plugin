name: Publish package
on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[1-9]*"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Build and check release packages
    if: github.event_name == 'push'
    uses: ./.github/workflows/package.yaml
    with:
      release_tag: ${{ github.ref_name }}
  preflight:
    name: Verify release tarballs
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download every packed artifact
        uses: actions/download-artifact@v8
        with:
          pattern: npm-package-*
          path: packages
      - name: Verify the exact tarballs and record release metadata
        shell: bash
        run: |-
          mkdir -p packages/npm-release
          bash scripts/npm-release.sh prepare "$GITHUB_REF_NAME" packages > packages/npm-release/manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: npm-release
          path: packages/npm-release/manifest.json
          if-no-files-found: error
  stage:
    name: Submit the verified npm tarballs for approval
    needs: preflight
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-package-*
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: npm-release
          path: packages/npm-release
      - name: Stage the seven platform packages and the main package
        shell: bash
        run: bash scripts/npm-release.sh stage "$GITHUB_REF_NAME" packages
      - name: Preserve confirmed submissions and any unconfirmed attempt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-stage
          path: packages/npm-stage/submissions.ndjson

  registry-metadata:
    name: Read the published release metadata
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: release
        shell: bash
        run: |-
          matrix=$(jq -ce . .github/package-matrix.json)
          version=$(node scripts/release-version.ts "$GITHUB_REF_NAME")
          dist_tag=$(node --input-type=module -e 'import { tlaDistTag } from "./scripts/tla-version.ts"; console.log(tlaDistTag)')
          commit=$(git rev-parse HEAD)
          {
            echo "matrix=$matrix"
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
  registry-smoke:
    name: Public registry smoke (${{ matrix.platform }})
    if: github.event_name == 'release'
    needs: registry-metadata
    permissions: {}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.registry-metadata.outputs.matrix) }}
    env:
      RELEASE_VERSION: ${{ needs.registry-metadata.outputs.version }}
      RELEASE_DIST_TAG: ${{ needs.registry-metadata.outputs.dist_tag }}
      RELEASE_COMMIT: ${{ needs.registry-metadata.outputs.commit }}
      EXPECTED_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Fetch the smoke script at the release commit
        shell: bash
        run: |-
          curl --fail --silent --show-error --retry 3 --max-time 15 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_COMMIT/scripts/registry-smoke.ts" \
            --output registry-smoke.ts
      - uses: actions/setup-node@v7
        if: ${{ !matrix.alpine_container }}
        with:
          node-version: 24
          token: ""
          package-manager-cache: false
      - name: Install from public npm and exercise MCP
        if: ${{ !matrix.alpine_container }}
        shell: bash
        run: node registry-smoke.ts "$RELEASE_VERSION" "$RELEASE_DIST_TAG" "$EXPECTED_PLATFORM"
      - name: Install from public npm and exercise MCP in Alpine
        if: matrix.alpine_container
        shell: bash
        env:
          ALPINE_CONTAINER: ${{ matrix.alpine_container }}
          CONTAINER_ARCH: ${{ matrix.container_arch }}
          HOST_ARCH: ${{ matrix.host_arch }}
        run: |-
          if [ "$(uname -m)" != "$HOST_ARCH" ]; then
            echo "Expected a native $HOST_ARCH runner for $EXPECTED_PLATFORM" >&2
            exit 1
          fi
          docker run --rm --platform "linux/$CONTAINER_ARCH" \
            --mount "type=bind,source=$PWD/registry-smoke.ts,target=/registry-smoke.ts,readonly" \
            "$ALPINE_CONTAINER" node /registry-smoke.ts "$RELEASE_VERSION" "$RELEASE_DIST_TAG" "$EXPECTED_PLATFORM"
