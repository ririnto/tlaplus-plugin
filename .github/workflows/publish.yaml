name: Publish package
on:
  push:
    tags:
      - "20*"

permissions:
  id-token: write
  contents: write

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version: "25"
          check-latest: true
          cache: maven
      - name: Check native build tools
        shell: pwsh
        run: |-
          $platform = node -p 'process.platform + "-" + process.arch'
          if ($LASTEXITCODE -ne 0 -or $platform -ne $env:EXPECTED_PLATFORM) {
            throw "Runner platform does not match $env:EXPECTED_PLATFORM"
          }
          $nativeImage = if ($IsWindows) { 'bin/native-image.cmd' } else { 'bin/native-image' }
          & (Join-Path $env:JAVA_HOME $nativeImage) --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mvn --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      - name: Stamp the release version derived from the tag
        shell: bash
        run: |-
          version=$(node scripts/release-version.mjs "$GITHUB_REF_NAME")
          npm version "$version" --no-git-tag-version
      - name: Sync platform package versions
        run: node scripts/sync-optional-deps.mjs
      - name: Build
        if: runner.os != 'Windows'
        run: node scripts/build.mjs
      - name: Build with Visual Studio x64 tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |-
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -version '[17.13.2,)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio x64 Build Tools 17.13.2 or later are required' }
          $script = Join-Path $env:RUNNER_TEMP 'build-tlaplus.cmd'
          @"
          @echo off
          call "$install\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not defined WindowsSdkDir exit /b 1
          where cl.exe
          if errorlevel 1 exit /b 1
          node scripts\build.mjs
          exit /b %errorlevel%
          "@ | Set-Content $script -Encoding ascii
          & $env:ComSpec /d /c $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack the main package
        run: npm pack --ignore-scripts
      - name: Pack the platform package
        run: npm pack ./npm
      - name: Test the packed artifacts without Java on the consumer PATH
        shell: bash
        run: |-
          main=$(find . -maxdepth 1 -name 'ririnto-tlaplus-[0-9]*.tgz' -print -quit)
          platform=$(find . -maxdepth 1 -name "ririnto-tlaplus-${{ matrix.platform }}-*.tgz" -print -quit)
          npm test -- "$main" "$platform"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ matrix.platform }}
          path: "*.tgz"
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  publish:
    name: Publish to npm
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download every packed artifact
        uses: actions/download-artifact@v8
        with:
          pattern: npm-package-*
          path: packages
      - name: Publish every platform package, then the main package
        run: |-
          find packages -name '*.tgz' ! -name 'ririnto-tlaplus-[0-9]*' -print0 | xargs -0 -n1 npm publish --tag latest
          main=$(find packages -name 'ririnto-tlaplus-[0-9]*.tgz' -print -quit)
          npm publish "$main" --tag latest
      - name: Create the GitHub release carrying the published npm tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes $(find packages -name '*.tgz')
