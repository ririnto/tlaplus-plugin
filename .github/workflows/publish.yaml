name: Publish package
on:
  push:
    tags:
      - "20*"

permissions:
  id-token: write
  contents: write

jobs:
  package:
    name: Build and check release packages
    permissions:
      contents: read
    uses: ./.github/workflows/package.yaml
    with:
      release_tag: ${{ github.ref_name }}
  publish:
    name: Publish to npm
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download every packed artifact
        uses: actions/download-artifact@v8
        with:
          pattern: npm-package-*
          path: packages
      - name: Select one tarball per npm package
        shell: bash
        run: |-
          mkdir release-packages
          copy_tarball() {
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "Expected exactly one tarball for $1" >&2
              exit 1
            fi
            cp "$1" release-packages/
          }
          copy_tarball packages/npm-package-linux-x64-gnu/tlaplus-mcp-tlaplus-mcp-[0-9]*.tgz
          for platform in darwin-arm64 darwin-x64 linux-arm64-gnu linux-arm64-musl linux-x64-gnu linux-x64-musl win32-x64; do
            copy_tarball "packages/npm-package-$platform/tlaplus-mcp-tlaplus-mcp-$platform-"[0-9]*.tgz
          done
      - name: Publish every platform package, then the main package
        shell: bash
        run: |-
          version=$(node scripts/release-version.mjs "$GITHUB_REF_NAME")
          dist_tag=$(node --input-type=module -e 'import { tlaDistTag } from "./scripts/tla-version.mjs"; console.log(tlaDistTag)')
          tarballs=(
            release-packages/tlaplus-mcp-tlaplus-mcp-{darwin-arm64,darwin-x64,linux-arm64-gnu,linux-arm64-musl,linux-x64-gnu,linux-x64-musl,win32-x64}-"$version".tgz
            release-packages/tlaplus-mcp-tlaplus-mcp-"$version".tgz
          )
          for tarball in "${tarballs[@]}"; do
            packed_version=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
            if [ "$packed_version" != "$version" ]; then
              echo "Expected package version $version in $tarball, got $packed_version" >&2
              exit 1
            fi
          done
          for tarball in "${tarballs[@]}"; do
            npm publish "$tarball" --access public --tag "$dist_tag"
          done
      - name: Create the GitHub release carrying the published npm tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes release-packages/*.tgz
