name: Test release package
on: pull_request

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: '*.tgz'
          compression-level: 0
          retention-days: 3

  test:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - run: npm install
      - shell: bash
        run: tar -xf ./*.tgz --strip-components=1 package/dist
      - run: npm test
